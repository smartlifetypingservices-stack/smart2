[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Admin Secret Access Route
[[redirects]]
  from = "/sl-gate-2026"
  to = "/index.html"
  status = 200

# 301 Redirects: Standardize no-slash URLs to trailing slash in a single hop
